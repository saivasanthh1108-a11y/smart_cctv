<svg width="800" height="420" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0a0f1d"/>
  <rect x="20" y="20" width="760" height="380" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <text x="40" y="55" fill="#818cf8" font-family="monospace" font-size="14" font-weight="bold">YAMNet AUDIO AI &amp; MULTIMODAL FUSION (/analyze-audio)</text>
  <text x="40" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11">TensorFlow Hub YAMNet AudioSet Classification + Late Sensor Fusion Engine</text>

  <!-- Left audio scores box -->
  <rect x="40" y="95" width="340" height="140" rx="6" fill="#1e1b4b" stroke="#4338ca"/>
  <text x="60" y="125" fill="#a5b4fc" font-family="sans-serif" font-size="12" font-weight="bold">Acoustic Class Probability (YAMNet)</text>
  
  <text x="60" y="155" fill="#fcd34d" font-family="sans-serif" font-size="11">Siren / Emergency Vehicle Score: 0.942</text>
  <rect x="60" y="165" width="300" height="10" rx="5" fill="#312e81"/>
  <rect x="60" y="165" width="282" height="10" rx="5" fill="#f59e0b"/>

  <text x="60" y="195" fill="#f87171" font-family="sans-serif" font-size="11">Crash / Screech Score: 0.884</text>
  <rect x="60" y="205" width="300" height="10" rx="5" fill="#312e81"/>
  <rect x="60" y="205" width="265" height="10" rx="5" fill="#ef4444"/>

  <!-- Right fusion box -->
  <rect x="400" y="95" width="360" height="270" rx="6" fill="#064e3b" stroke="#059669"/>
  <text x="420" y="125" fill="#6ee7b7" font-family="sans-serif" font-size="13" font-weight="bold">Multimodal Fusion Formula Result</text>
  
  <text x="420" y="160" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold">93.2%</text>
  <text x="520" y="150" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">CRITICAL_ACTION</text>
  <text x="520" y="170" fill="#a7f3d0" font-family="sans-serif" font-size="11">Signal preemption wave active</text>

  <rect x="420" y="190" width="320" height="60" rx="4" fill="#022c22"/>
  <text x="430" y="210" fill="#2dd4bf" font-family="monospace" font-size="10">F = min(1.0, 0.55*Sv + 0.35*Sa + 0.10*sqrt(Sv*Sa))</text>
  <text x="430" y="230" fill="#99f6e4" font-family="monospace" font-size="10">Sv=0.94 (Overlap) | Sa=0.94 (Siren) | Syn=0.08</text>

  <text x="420" y="275" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">AudioSet Classes Detected:</text>
  <text x="420" y="295" fill="#cbd5e1" font-family="monospace" font-size="10">• Ambulance (siren) - 94.2%</text>
  <text x="420" y="315" fill="#cbd5e1" font-family="monospace" font-size="10">• Emergency vehicle - 89.5%</text>
  <text x="420" y="335" fill="#cbd5e1" font-family="monospace" font-size="10">• Tire squeal / Screech - 88.4%</text>

  <!-- Bottom notes -->
  <rect x="40" y="250" width="340" height="115" rx="6" fill="#111827" stroke="#334155"/>
  <text x="55" y="275" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="bold">Cross-Modal Synergy Benefits:</text>
  <text x="55" y="295" fill="#94a3b8" font-family="sans-serif" font-size="10">1. Eliminates single-sensor optical blind spots</text>
  <text x="55" y="315" fill="#94a3b8" font-family="sans-serif" font-size="10">2. Accelerates preemption 3.8s before visual line of sight</text>
  <text x="55" y="335" fill="#94a3b8" font-family="sans-serif" font-size="10">3. Reduces emergency dispatch latency by 73%</text>
